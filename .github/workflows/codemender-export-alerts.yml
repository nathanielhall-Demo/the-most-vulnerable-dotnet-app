name: CodeMender Scan (export GitHub Code Scanning)
on:
  # Trigger manually via the GitHub Actions UI
  workflow_dispatch:

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      security-events: write
      actions: read

    steps:
      # Checkout the TARGET repository
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Download and Install CodeMender On-The-Fly (Original - no new secrets needed)
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm init

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      - name: Update config.yaml with file types
        shell: python
        run: |
          import os
          import yaml
    
          config_file = os.path.expanduser('~/.codemender/config.yaml')
            
          # 1. Discover all unique file extensions, excluding .git
          extensions = set()
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for file in files:
                  _, ext = os.path.splitext(file)
                  if ext:
                      extensions.add(ext)
    
          # 2. Load existing config
          if os.path.exists(config_file):
              with open(config_file, 'r') as f:
                  config = yaml.safe_load(f) or {}
          else:
              print("Config not found")
              config = {}
    
          # Ensure nested keys exist safely
          config.setdefault('scan', {}).setdefault('extensions', {})
          list_key = 'include'
          if list_key not in config['scan']['extensions'] or config['scan']['extensions'][list_key] is None:
              config['scan']['extensions'][list_key] = []
    
          # 3. Add new extensions
          for ext in sorted(extensions):
              if ext not in config['scan']['extensions'][list_key]:
                  config['scan']['extensions'][list_key].append(ext)
    
          # Disable interactive prompts for CI/CD execution
          config.setdefault('tools', {})
          config['tools']['confirm_commands'] = False
          config['tools']['confirm_writes'] = False

          # 4. Write back
          with open(config_file, 'w') as f:
              yaml.dump(config, f, default_flow_style=False)
          print(f"Updated {config_file} with {len(config['scan']['extensions'][list_key])} extensions.")

      - name: Find
        run: |
          set -o pipefail
          cm find . -y 2>&1 | tee scan_output.log

      # Generate and Publish the Report
      - name: Generate Security Report
        run: |
          echo "📊 Generating Markdown and JSON reports..."
          cm report --format md > codemender_summary.md

          # Export open CRITICAL findings so GitHub Security Overview shows multi-severity breakdown
          cm report --severity CRITICAL --format json > codemender_report.json

          # Extract the execution and token usage line from the scan log
          TOKEN_SUMMARY=$(grep "Tokens:" scan_output.log | tail -n 1 || true)

          # If the token summary was found, inject it at the top of the GitHub Step Summary
          if [ -n "$TOKEN_SUMMARY" ]; then
            echo "### 🪙 Execution & Token Usage" >> $GITHUB_STEP_SUMMARY
            echo "> $TOKEN_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          fi

          echo "# CodeMender Scan Results" >> $GITHUB_STEP_SUMMARY
          cat codemender_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Format SARIF Report for GitHub UI
        run: |
          python3 -c '
          import json, re, os, fnmatch, posixpath
          from collections import defaultdict

          # GitHub input variable to extract relative path dynamically
          repo_name = "${{ github.repository }}"
          repo_short_name = repo_name.split("/")[-1]
          workspace = os.environ.get("GITHUB_WORKSPACE", "")

          # Parse .github/CODEOWNERS (last matching pattern wins, matching GitHub rules)
          codeowners_rules = []
          for co_file in (".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"):
              if os.path.isfile(co_file):
                  with open(co_file, "r") as cf:
                      for raw_line in cf:
                          line = raw_line.split("#", 1)[0].strip()
                          if not line:
                              continue
                          parts = line.split()
                          if len(parts) >= 2:
                              codeowners_rules.append((parts[0], parts[1:]))
                  break

          def resolve_owner(rel_path):
              matched = ["@unassigned"]
              norm = rel_path.lstrip("/")
              base = posixpath.basename(norm)
              for pattern, owners in codeowners_rules:
                  if pattern == "*":
                      matched = owners
                  elif "/" not in pattern.strip("/"):
                      if fnmatch.fnmatch(base, pattern) or norm.startswith(pattern.strip("/") + "/"):
                          matched = owners
                  else:
                      clean_pat = pattern.lstrip("/")
                      if clean_pat.endswith("/") and norm.startswith(clean_pat):
                          matched = owners
                      elif fnmatch.fnmatch(norm, clean_pat) or fnmatch.fnmatch(norm, clean_pat.rstrip("/") + "/*"):
                          matched = owners
              return matched[0]

          # Load JSON export (all findings, no Top-N cap)
          with open("codemender_report.json", "r") as f:
              findings = json.load(f)

          rules = []
          results = []
          seen_rules = set()
          by_owner = defaultdict(list)
      
          # 1. Map CodeMender severity to SARIF level (error, warning, note)
          severity_to_level = {
              "CRITICAL": "error",
              "HIGH": "error",
              "MEDIUM": "warning",
              "LOW": "note",
              "INFO": "note"
          }

          # 2. Map CodeMender severity to GitHub numeric security-severity (CVSS 0.0-10.0)
          # GitHub mapping: >=9.0 = Critical, 7.0-8.9 = High, 4.0-6.9 = Medium, 0.1-3.9 = Low
          severity_to_ghas_score = {
              "CRITICAL": "9.5",
              "HIGH": "7.5",
              "MEDIUM": "5.5",
              "LOW": "2.5",
              "INFO": "1.0"
          }

          # 3. Map CodeMender severity to precision
          severity_to_precision = {
              "CRITICAL": "very-high",
              "HIGH": "high",
              "MEDIUM": "medium",
              "LOW": "low",
              "INFO": "low"
          }

          for finding in findings:
              title = finding.get("title", "Unknown-Rule").strip()
              raw_severity = finding.get("severity", "MEDIUM").upper()
              analysis = finding.get("analysis", "")
              finding_status = str(finding.get("status", "OPEN")).upper()

              # Skip findings already marked FIXED or DISMISSED in CodeMender state if any
              if finding_status in ("FIXED", "DISMISSED", "CLOSED"):
                  continue

              # Normalize file_path to clean repository-relative path
              file_path = finding.get("file_path", "unknown")
              relative_path = file_path
              if workspace and relative_path.startswith(workspace):
                  relative_path = relative_path[len(workspace):]
              elif "/home/runner/work/" in relative_path and repo_short_name in relative_path:
                  relative_path = relative_path.split(repo_short_name + "/")[-1]
              if repo_short_name and relative_path.startswith(repo_short_name + "/"):
                  relative_path = relative_path[len(repo_short_name + "/"):]
              relative_path = relative_path.lstrip("./").lstrip("/") or "unknown"

              # Resolve owning team from .github/CODEOWNERS
              code_owner = resolve_owner(relative_path)
              owner_slug = re.sub(r"[^a-z0-9_-]+", "-", code_owner.split("/")[-1].lstrip("@").lower()).strip("-") or "unassigned"

              # Create a stable, clean rule ID (include severity and owner so owner tags stay distinct per team)
              slug = re.sub(r"[^a-zA-Z0-9_-]+", "-", title).strip("-")[:65]
              base_id = f"CM-{raw_severity}-{slug}" if slug else f"CM-{raw_severity}-Finding"
              rule_id = f"{base_id}--{owner_slug}"

              level = severity_to_level.get(raw_severity, "warning")
              ghas_score = severity_to_ghas_score.get(raw_severity, "5.5")
              precision = severity_to_precision.get(raw_severity, "medium")

              # Extract any CWE references and include the owner/<team> tag (capped at 10 tags for GitHub SARIF limit)
              tags = ["security", "codemender", f"severity/{raw_severity.lower()}", f"owner/{owner_slug}"]
              cwe_matches = re.findall(r"CWE-\d+", f"{title} {analysis}", re.IGNORECASE)
              for cwe in cwe_matches:
                  cwe_tag = f"external/cwe/{cwe.lower()}"
                  if cwe_tag not in tags and len(tags) < 10:
                      tags.append(cwe_tag)

              # Populate Rules Array with GitHub Code Scanning required security properties
              if rule_id not in seen_rules:
                  rules.append({
                      "id": rule_id,
                      "name": title,
                      "shortDescription": {
                          "text": title
                      },
                      "fullDescription": {
                          "text": analysis[:1000] if analysis else title
                      },
                      "defaultConfiguration": {
                          "level": level
                      },
                      "help": {
                          "text": f"Code Owner: {code_owner}\n\n{title}\n\n{analysis}",
                          "markdown": f"### {title}\n\n**Severity:** `{raw_severity}` | **Code Owner:** `{code_owner}`\n\n{analysis}"
                      },
                      "properties": {
                          "tags": tags,
                          "precision": precision,
                          "problem.severity": level,
                          "security-severity": ghas_score
                      }
                  })
                  seen_rules.add(rule_id)

              start_line = max(1, int(finding.get("start_line") or 1))
              end_line = max(start_line, int(finding.get("end_line") or start_line))

              # Populate Results Array
              results.append({
                  "ruleId": rule_id,
                  "level": level,
                  "message": {
                      "text": f"[{raw_severity}] ({code_owner}) {title}: {analysis}"
                  },
                  "locations": [
                      {
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": relative_path,
                                  "uriBaseId": "%SRCROOT%"
                              },
                              "region": {
                                  "startLine": start_line,
                                  "endLine": end_line
                              }
                          }
                      }
                  ]
              })

              cm_id = f"CM-{len(results):03d}"
              by_owner[code_owner].append(
                  f"| **`{cm_id}`** | `{raw_severity}` | {title} | `{relative_path}:{start_line}` |"
              )

          # Construct Final SARIF Structure
          sarif_output = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "CodeMender",
                              "informationUri": "https://cloud.google.com/gemini-enterprise-agent-platform",
                              "version": "0.15.0",
                              "rules": rules
                          }
                      },
                      "results": results
                  }
              ]
          }

          with open("output.sarif", "w") as f:
              json.dump(sarif_output, f, indent=2)
          print(f"Generated output.sarif with {len(rules)} rules and {len(results)} security results.")

          # Build one Markdown file per CODEOWNER team + manifest for the GitHub CLI step
          color_map = {
              "backend-api": "1D76DB",
              "frontend-ui": "5319E7",
              "platform-team": "0E8A16"
          }
          manifest = []
          for owner_name, rows in by_owner.items():
              o_slug = re.sub(r"[^a-z0-9_-]+", "-", owner_name.split("/")[-1].lstrip("@").lower()).strip("-") or "unassigned"
              body_file = f"backlog_issue_{o_slug}.md"
              issue_lines = [
                  f"## 🛡️ CodeMender Security Backlog — `{owner_name}`",
                  "",
                  f"**Repository:** `{repo_name}` | **Code Owner:** `{owner_name}` | **Open Findings:** `{len(rows)}`",
                  "",
                  "> **GitOps Remediation:** Comment `/codemender fix <ID>` (for example, `/codemender fix CM-001`) on this issue to dispatch CodeMender and open a dedicated Fix PR routed to your team.",
                  "",
                  "| ID | Severity | Finding | Location |",
                  "| :--- | :--- | :--- | :--- |"
              ]
              issue_lines.extend(rows)
              issue_lines.append("")
              with open(body_file, "w") as bf:
                  bf.write("\n".join(issue_lines))
              manifest.append({
                  "owner_name": owner_name,
                  "owner_slug": o_slug,
                  "owner_label": f"owner/{o_slug}",
                  "color": color_map.get(o_slug, "0052CC"),
                  "count": len(rows),
                  "body_file": body_file
              })

          with open("backlog_manifest.json", "w") as mf:
              json.dump(manifest, mf, indent=2)
          '

      # Upload the SARIF payload directly to the target repository using the GitHub CLI
      - name: Upload SARIF directly via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Compress the SARIF file into GZIP Base64 file (avoids bash argument length limits)
          gzip -c "output.sarif" | base64 -w 0 > sarif.b64
          
          # 2. Extract the exact commit hash of the checked-out codebase
          COMMIT_SHA=$(git rev-parse HEAD)
          
          # 3. Safely resolve the active branch reference name
          BRANCH_REF="${GITHUB_REF:-$(git symbolic-ref HEAD 2>/dev/null || echo 'refs/heads/main')}"
          
          echo "Uploading SARIF payload natively to ${{ github.repository }} (ref: $BRANCH_REF, sha: $COMMIT_SHA)..."
          
          # 4. Execute the secure POST request directly through the GH CLI engine using @file syntax
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/code-scanning/sarifs" \
            -f commit_sha="$COMMIT_SHA" \
            -f ref="$BRANCH_REF" \
            -F sarif=@sarif.b64 \
            -f tool_name="CodeMender"

      # Create or update one CodeMender Security Backlog Issue per CODEOWNER team
      - name: Sync Per-Team CodeMender Backlog Issues
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import subprocess

          def gh(*args):
              res = subprocess.run(["gh", *args], capture_output=True, text=True)
              return res.stdout.strip()

          # 1. Ensure base label exists
          gh("label", "create", "codemender-backlog", "--color", "B60205", "--description", "CodeMender Security Backlog", "--force")

          with open("backlog_manifest.json", "r") as f:
              manifest = json.load(f)

          active_team_labels = {item["owner_label"] for item in manifest}

          # 2. Fetch all open codemender-backlog issues
          raw_issues = gh("issue", "list", "--label", "codemender-backlog", "--state", "open", "--json", "number,title,labels")
          open_issues = json.loads(raw_issues) if raw_issues else []

          # Map owner_label -> issue number (and close any legacy combined issue without an owner/* label)
          issue_by_team = {}
          for iss in open_issues:
              num = str(iss["number"])
              labels = [lbl["name"] for lbl in iss.get("labels", [])]
              owner_labels = [lbl for lbl in labels if lbl.startswith("owner/")]
              if not owner_labels:
                  gh("issue", "close", num, "--comment", "Superseded by per-team `CODEOWNERS` backlog issues.")
                  print(f"Closed legacy combined Backlog Issue #{num}")
              else:
                  issue_by_team[owner_labels[0]] = num

          # 3. Create or update one Backlog Issue per CODEOWNER team
          for item in manifest:
              owner_name = item["owner_name"]
              owner_label = item["owner_label"]
              color = item["color"]
              count = item["count"]
              body_file = item["body_file"]
              title = f"🛡️ [CodeMender] Backlog: {owner_name} ({count} open)"

              gh("label", "create", owner_label, "--color", color, "--description", f"Owned by {owner_name}", "--force")

              if owner_label in issue_by_team:
                  num = issue_by_team[owner_label]
                  gh("issue", "edit", num, "--title", title, "--body-file", body_file)
                  print(f"Updated Backlog Issue #{num} for {owner_name}")
              else:
                  out = gh("issue", "create", "--title", title, "--label", "codemender-backlog", "--label", owner_label, "--body-file", body_file)
                  print(f"Created Backlog Issue for {owner_name}: {out}")

          # 4. Auto-close any team backlog issue whose team dropped to 0 open findings
          for owner_label, num in issue_by_team.items():
              if owner_label not in active_team_labels:
                  gh("issue", "close", num, "--comment", "🎉 All CodeMender security findings for this team have been resolved!")
                  print(f"Auto-closed resolved Backlog Issue #{num} ({owner_label})")

      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -f output.sarif sarif.b64 backlog_issue*.md backlog_manifest.json codemender_report.json codemender_summary.md scan_output.log
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
